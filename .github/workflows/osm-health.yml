name: osm-health
# The hosted OpenStreetMap copy's health check (osm/health.py) on its own: the R2 lifecycle rules and each market's
# manifest age. The nightly sweep runs the same check into results/liveness/REPORT.md; this one is for checking now.
# Push runs/osm-health.env or dispatch it; the result is in the run's summary.
on:
  push:
    branches: [main]
    paths: ['runs/osm-health.env', 'osm/health.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 osm/health.py | tee -a $GITHUB_STEP_SUMMARY
