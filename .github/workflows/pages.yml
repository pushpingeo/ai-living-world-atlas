name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'atlas/viewer_data.py', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [spike, tag]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build viewer data from the latest crawl and tags
        run: |
          git fetch -q origin results/spike-gb && git show FETCH_HEAD:datasets.parquet > /tmp/datasets.parquet
          CRAWL=$(git show FETCH_HEAD:RUN.txt | awk '{print $2}' | cut -c1-7)
          TAGS=""
          if git fetch -q origin results/tags-gb 2>/dev/null && git show FETCH_HEAD:tags.parquet > /tmp/tags.parquet 2>/dev/null; then TAGS=/tmp/tags.parquet; fi
          mkdir -p _site && cp -r site/. _site/
          python -m atlas.viewer_data --datasets /tmp/datasets.parquet ${TAGS:+--tags $TAGS} --out _site/data \
            --meta "{\"crawl_commit\":\"$CRAWL\",\"built\":\"$(date -u +%F)\"}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
