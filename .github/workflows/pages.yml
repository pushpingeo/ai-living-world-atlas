name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'atlas/viewer_data.py', 'atlas/combine.py', 'runs/published.txt', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [spike, tag]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build viewer data from all published waves and tags
        run: |
          bash .github/actions-fetch.sh
          mkdir -p _site && cp -r site/. _site/
          TAGS=""; [ -f /tmp/pub/tags.parquet ] && TAGS=/tmp/pub/tags.parquet
          python -m atlas.viewer_data --datasets /tmp/pub/datasets.parquet ${TAGS:+--tags $TAGS} --out _site/data \
            --meta "{\"built\":\"$(date -u +%F)\"}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
