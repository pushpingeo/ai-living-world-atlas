name: mcp-check
# Live check of the MCP tools Tobler relies on (docs/mcp-tools.md): find_datasets, get_dataset, fetch_features.
# Edit runs/mcp-check.env and push to run it. Results (never the key) go to results/mcp-check.
on:
  push:
    branches: [main]
    paths: ['runs/mcp-check.env']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ATLAS_MCP_KEY: ${{ secrets.ATLAS_MCP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyproj rasterio lerc
      - name: Call the tools
        run: |
          python3 - <<'PY' | tee /tmp/check.txt
          import json, os, time, urllib.request
          EP = "https://atlas-mcp.robdunfey.workers.dev/mcp"
          KEY = os.environ["ATLAS_MCP_KEY"]
          def call(name, args):
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": name, "arguments": args}}).encode()
              req = urllib.request.Request(EP, body, {"Authorization": f"Bearer {KEY}", "content-type": "application/json", "User-Agent": "atlas-mcp-check (+https://github.com/pushpingeo/ai-living-world-atlas)"})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read(); code = r.status
              except urllib.error.HTTPError as e:
                  raw = e.read(); code = e.code
              except Exception as e:
                  return None, f"{type(e).__name__}: {e}", time.time() - t
              ms = time.time() - t
              try:
                  d = json.loads(raw)
              except Exception:
                  return None, f"HTTP {code}, not JSON: {raw[:200]!r}", ms
              if "error" in d:
                  return None, f"HTTP {code}, error: {json.dumps(d['error'])[:300]}", ms
              res = d.get("result", {})
              if res.get("isError"):
                  return None, f"HTTP {code}, tool error: {json.dumps(res.get('content'))[:300]}", ms
              return res.get("structuredContent"), f"HTTP {code}", ms
          cases = [
              ("Edinburgh, any", {"lon": -3.19, "lat": 55.95, "radius_km": 5, "limit": 100}),
              ("Edinburgh, road, query", {"lon": -3.19, "lat": 55.95, "radius_km": 5, "concept": "road", "capability": "query", "geometry": "line", "limit": 100}),
              ("Nigeria bbox, oil-gas", {"bbox": [2.7, 4.2, 14.7, 13.9], "concept": "oil-gas", "limit": 100}),
              ("North Sea, protected-area", {"bbox": [-2, 56, 4, 61], "concept": "protected-area", "capability": "query", "limit": 100}),
          ]
          # World-wide and large-area searches (Tobler request: D1 overload, 17 Nov)
          W = [-180, -85, 180, 85]
          for label, args in [("VIIRS", {"bbox": W, "text": "VIIRS"}), ("fire", {"bbox": W, "text": "fire"}), ("thermal", {"bbox": W, "text": "thermal"}),
                              ("hotspot", {"bbox": W, "text": "hotspot"}), ("MODIS", {"bbox": W, "text": "MODIS"}), ("essential fish habitat", {"bbox": W, "text": "essential fish habitat"}),
                              ("Wildfire Response Points", {"bbox": W, "text": "Wildfire Response Points"}),
                              ("UK, no text", {"bbox": [-8, 49.5, 2, 61]}), ("Edinburgh 5 km", {"lon": -3.19, "lat": 55.95, "radius_km": 5}),
                              ("Gulf of Mexico, no text", {"bbox": [-98, 18, -80, 31]}), ("Atlantic, no text", {"bbox": [-80, -60, 20, 70]}),
                              ("world, no text", {"bbox": W}), ("Gulf of Mexico, oil-gas", {"bbox": [-98, 18, -80, 31], "concept": "oil-gas"}),
                              # spatial index (18 Nov): small areas, concepts over large areas, sparse large areas
                              ("Edinburgh 5 km, road, query, line", {"lon": -3.19, "lat": 55.95, "radius_km": 5, "concept": "road", "capability": "query", "geometry": "line"}),
                              ("Berlin 10 km", {"lon": 13.4, "lat": 52.52, "radius_km": 10}), ("Lagos 20 km", {"lon": 3.4, "lat": 6.45, "radius_km": 20}),
                              ("US, protected-area", {"bbox": [-125, 24, -66, 50], "concept": "protected-area"}),
                              ("Europe, admin-boundary", {"bbox": [-11, 35, 30, 71], "concept": "admin-boundary"}),
                              ("Nigeria, no text", {"bbox": [2.7, 4.2, 14.7, 13.9]})]:
              time.sleep(1.5)  # one query a second or so, like an agent; a burst of heavy ones trips D1's 10-second window
              r, status, s = call("find_datasets", {**args, "limit": 5, "debug": True})
              top = [f"{x['title'][:40]} ({x['publisher_type']}{', +' + str(len(x['also_available_from'])) if x.get('also_available_from') else ''})" for x in r["results"][:3]] if r else []
              print(f"find_datasets [world: {label}]: {status}, {s:.1f}s, {r.get('search') if r else '-'}, matches {r.get('matches') if r else '-'}{' capped' if r and r.get('matches_capped') else ''}, rows read {r.get('rows_read') if r else '-'} ({r.get('index') if r else '-'}): {top}")
          first_query = None
          for label, args in cases:
              r, status, s = call("find_datasets", args)
              n = len(r["results"]) if r else 0
              print(f"find_datasets [{label}]: {status}, {s:.1f}s, matches {r.get('matches') if r else '-'}, results {n}")
              if r and n:
                  x = r["results"][0]
                  missing = [k for k in ("id", "title", "publisher", "publisher_type", "coverage", "licence", "extent_may_be_overstated", "geometry", "country") if k not in x]
                  print(f"   first: {x['title'][:70]} | licence: {str(x.get('licence'))[:60]} | missing fields: {missing or 'none'}")
                  if args.get("capability") == "query" and not first_query:
                      first_query = (x["id"], args)
          # Tobler's NSTA pipeline case: the WGS84 record must fetch live pipelines at Rosebank
          rb = {"bbox": [-4.6, 60.6, -3.0, 61.4], "limit": 50}
          for did in ("bdb5d0a70436343e", "29a134d61746d7dc"):
              r, status, s = call("fetch_features", {"id": did, **rb})
              print(f"fetch_features [{did} at Rosebank]: {status}, {s:.1f}s, returned {r.get('returned') if r else '-'}")
          r, status, s = call("get_dataset", {"id": "bdb5d0a70436343e"})
          print(f"get_dataset [bdb5d0a70436343e]: {status}, title {r.get('title') if r else '-'!r}, endpoint {r['endpoints'][0]['url'].split('/services/')[-1] if r and r.get('endpoints') else '-'}")
          # EMODnet (Tobler request): wrecks as features, with a licence
          r, status, s = call("get_dataset", {"id": "ee41a8d58f1fe201"})
          print(f"get_dataset [EMODnet wrecks ee41a8d58f1fe201]: {status}, {r.get('title') if r else '-'!r}, protocols {[e['protocol'] for e in r['endpoints']] if r else '-'}, licence {str(r.get('licence'))[:70] if r else '-'!r}")
          # Historic Environment Scotland (19 Nov): its ArcGIS layers can't page and refused resultRecordCount
          for did, label, box in [("25ffbbeec3836e1a", "Scheduled Monuments", [-3.3, 55.9, -3.1, 56.0]),
                                  ("3a18f791239ffd9d", "Listed Buildings by Category", [-3.22, 55.94, -3.17, 55.96]),
                                  ("ef844f9125925d00", "Listed Buildings boundaries", [-3.22, 55.94, -3.17, 55.96]),
                                  ("bee072abd4e7a820", "World Heritage Sites", [-3.3, 55.9, -3.1, 56.0]),
                                  ("09cc8b2c75d938a0", "Gardens and Designed Landscapes", [-3.5, 55.8, -3.0, 56.1]),
                                  ("2a6ccedd63e53b29", "Battlefields", [-4.5, 55.5, -2.5, 56.5]),
                                  ("9a5e7b69b6270fe9", "Historic MPAs", [-8, 55, -1, 61]),
                                  ("4b9fae48448e6b03", "Garden and Designed Landscapes (WMS only)", [-3.5, 55.8, -3.0, 56.1]),
                                  ("130d381beaadd18e", "Canmore maritime", [-3.4, 55.9, -2.9, 56.1]),
                                  ("32614f5d7b69b2e5", "Canmore terrestrial", [-3.3, 55.9, -3.1, 56.0])]:
              r, status, s = call("fetch_features", {"id": did, "bbox": box, "limit": 20})
              print(f"fetch_features [HES {label}]: {status}, {s:.1f}s, returned {r.get('returned') if r else '-'} via {(r or {}).get('endpoint', {}).get('protocol', '-')}" + (f", errors {r.get('errors')}" if r and r.get('errors') else ""))
          # UK protected sites (Tobler, 22 Nov): every curated record returns features for a box inside its nation, quickly
          uk = [("fa98f1a8571830ba", "JNCC offshore MPAs, Dogger Bank", [1.0, 54.5, 2.0, 55.0]),
                ("a9cad137cd6e2466", "NE SAC, north Norfolk", [0.5, 52.8, 1.8, 53.2]), ("8b28077c10e3e057", "NE SPA, north Norfolk", [0.5, 52.8, 1.8, 53.2]),
                ("fc67624f3bd09663", "NE Ramsar, north Norfolk", [0.5, 52.8, 1.8, 53.2]), ("0c53cecc65701f0c", "NE SSSI, north Norfolk", [0.5, 52.8, 1.8, 53.2]),
                ("2470b667af95db9c", "NE MCZ, Channel (3 a page)", [-6, 49.5, 2, 51]), ("4d20427c9827e672", "NE ancient woodland, Norfolk", [1.0, 52.6, 1.4, 52.9]),
                ("f7fd85401cdf700f", "NE priority habitats, Norfolk", [1.0, 52.85, 1.1, 52.9]),
                ("7d382e1686a08bff", "NatureScot SAC, Forth", [-3.5, 55.95, -2.5, 56.3]), ("b10cb9d7a2892f7f", "NatureScot SPA, Forth", [-3.5, 55.95, -2.5, 56.3]),
                ("b2f1c178d39c0d0e", "NatureScot Ramsar, Forth", [-3.5, 55.95, -2.5, 56.3]), ("c6e90f0435ff9097", "NatureScot SSSI, Linlithgow", [-3.7, 55.9, -3.5, 56.05]),
                ("f682edebaabd1b8b", "NatureScot NCMPA, Sound of Mull", [-6.3, 56.3, -5.4, 56.8]), ("83edcb984cbc578d", "NatureScot ancient woodland, Linlithgow", [-3.7, 55.9, -3.5, 56.05]),
                ("f1f2acb0cb971df9", "NRW SAC, Pembrokeshire", [-5.4, 51.6, -4.9, 51.9]), ("0f71127c51a2172c", "NRW SPA, Pembrokeshire", [-5.4, 51.6, -4.9, 51.9]),
                ("a6fa6c34e1ffe4c1", "NRW Ramsar, Burry Inlet", [-4.4, 51.55, -4.0, 51.75]), ("0761e0de1e55f269", "NRW SSSI, Pembrokeshire", [-5.4, 51.6, -4.9, 51.9]),
                ("10f54cd67c434aa8", "NRW MCZ, Skomer", [-5.4, 51.6, -4.9, 51.9]), ("dae5eef189e09f22", "NRW ancient woodland, Pembrokeshire", [-5.0, 51.7, -4.8, 51.85]),
                ("da17adda6e50b6da", "DAERA SAC, Strangford", [-5.8, 54.3, -5.5, 54.6]), ("7571a1f57be683da", "DAERA SPA, Strangford", [-5.8, 54.3, -5.5, 54.6]),
                ("e4d3902ce86a9334", "DAERA ASSI, Strangford", [-5.8, 54.3, -5.5, 54.6]), ("a13d205bd42efeb8", "DAERA Ramsar, Strangford", [-5.8, 54.3, -5.5, 54.6]),
                ("6f8ffc3a4d831d53", "DAERA MPAs, Strangford", [-5.8, 54.3, -5.5, 54.6])]
          for did, label, box in uk:
              r, status, s = call("fetch_features", {"id": did, "bbox": box, "limit": 50, "include_geometry": False})
              names = sorted({str(next((v for k, v in f["properties"].items() if "name" in k.lower() and isinstance(v, str)), ""))[:28] for f in (r or {}).get("features", [])})[:4]
              print(f"UK protected [{label}]: {status}, {s:.1f}s, returned {r.get('returned') if r else '-'}{', pages ' + str(r['pages_read']) if r and r.get('pages_read') else ''}: {names}")
          g, status, s = call("get_dataset", {"id": "fa98f1a8571830ba"})
          print(f"get_dataset [JNCC offshore MPAs]: {status}, attribution {'yes' if (g or {}).get('attribution') else 'no'}, details {((g or {}).get('endpoints') or [{}])[0].get('details')}")
          # EMODnet Seabed Habitats point layers timed out after ~52 s at Dogger Bank (Tobler, 22 Nov): now one 15 s wait
          for did in ("31d669aa63029af3", "bf4c481ed3840316", "f992e3e075927999"):
              r, status, s = call("fetch_features", {"id": did, "lon": 1.47, "lat": 54.75, "radius_km": 25, "limit": 50})
              print(f"Seabed Habitats [{did}, Dogger Bank 50 km box]: {status}, {s:.1f}s, returned {r.get('returned') if r else '-'}")
          r, status, s = call("fetch_features", {"id": "ee41a8d58f1fe201", "bbox": [-6, 49, 2, 52], "limit": 50})
          print(f"fetch_features [EMODnet heritage wrecks, English Channel]: {status}, {s:.1f}s, returned {r.get('returned') if r else '-'}")
          r, status, s = call("fetch_features", {"id": "d266bb32a493da90", "bbox": [-4.6, 60.6, -3.0, 61.4], "limit": 50})
          print(f"fetch_features [UKHO wrecks via EMODnet, Rosebank]: {status}, {s:.1f}s, returned {r.get('returned') if r else '-'}")
          r, status, s = call("find_datasets", {"bbox": [-4.6, 59.5, 1.5, 61.5], "concept": "pipeline", "capability": "query", "limit": 100})
          em = [x for x in (r or {}).get("results", []) if "EMODnet" in (x.get("publisher") or "")]
          print(f"find_datasets [Shetland, pipeline, query]: {status}, {len((r or {}).get('results', []))} results, EMODnet: {[x['title'] for x in em][:5]}")
          # Africa: Uganda petroleum licences (national-authority rule)
          r, status, s = call("find_datasets", {"bbox": [29.5, -1.5, 35.0, 4.3], "concept": "oil-gas", "limit": 100})
          ug = [x for x in (r or {}).get("results", []) if "Petroleum Authority" in (x.get("publisher") or "")]
          print(f"find_datasets [Uganda, oil-gas]: {status}, {len((r or {}).get('results', []))} results, PAU: {[x['title'] for x in ug][:6]}")
          if ug:
              r2, status, s = call("fetch_features", {"id": ug[0]["id"], "bbox": [29.5, -1.5, 35.0, 4.3], "limit": 20})
              print(f"fetch_features [PAU {ug[0]['title']}]: {status}, {s:.1f}s, returned {r2.get('returned') if r2 else '-'}")
          # GEM extraction tracker (hosted file)
          time.sleep(1.5)
          r, status, s = call("find_datasets", {"bbox": [-4.6, 59.5, 1.5, 61.5], "text": "Global Energy Monitor extraction", "limit": 5})
          gem = [x for x in (r or {}).get("results", []) if "Extraction Tracker" in (x.get("title") or "")]
          print(f"find_datasets [GEM extraction, Shetland]: {status}, {[x['title'][:50] for x in gem]}")
          if gem:
              r2, status, s = call("fetch_features", {"id": gem[0]["id"], "bbox": [-4.6, 59.5, 1.5, 61.5], "limit": 20})
              print(f"fetch_features [GEM extraction, west of Shetland]: {status}, {s:.1f}s, returned {r2.get('returned') if r2 else '-'}, matched {r2.get('matched') if r2 else '-'}: {[f['properties'].get('Unit Name') for f in (r2 or {}).get('features', [])][:6]}")
          # GEM trackers (hosted, tiled): one search and one fetch each, in places where they should have data
          gem_cases = [
              ("Gas pipelines", [-2, 53, 8, 62], ""), ("Oil and NGL pipelines", [2.7, 4.2, 14.7, 13.9], ""),
              ("LNG import and export terminals", [-98, 18, -80, 31], ""), ("Oil and gas power plants", [-8, 49.5, 2, 61], ""),
              ("Coal power plants", [68, 6, 98, 36], ""), ("Coal mines", [112, -44, 154, -10], ""), ("Wind farms", [-180, -85, 180, 85], "Hornsea"),
              ("Solar farms", [-6, 36, 4, 44], ""), ("Nuclear power plants", [-6, 42, 9, 51], ""), ("Iron and steel plants", [-8, 49.5, 2, 61], ""),
              ("Hydropower plants", [-80, -35, -35, 6], ""), ("Coal terminals", [112, -44, 154, -10], ""),
          ]
          for title, bbox, text in gem_cases:
              time.sleep(1.2)
              r, status, s = call("find_datasets", {"bbox": bbox, "text": f"Global Energy Monitor {title}", "limit": 10})
              hit = next((x for x in (r or {}).get("results", []) if x["title"].startswith(title)), None)
              if not hit:
                  print(f"GEM [{title}]: not found by search ({status})"); continue
              r2, status, s = call("fetch_features", {"id": hit["id"], "bbox": bbox, "limit": 5, **({"text": text} if text else {})})
              print(f"GEM [{title}]: {status}, {s:.1f}s, returned {r2.get('returned') if r2 else '-'}, matched {r2.get('matched') if r2 else '-'}, licence {str((r2 or {}).get('licence'))[:20]!r}")
          # Values at a point (Tobler request, 19 Nov): find sampled endpoints, then read a number through each one
          import math, re as _re
          def fill(u, lon, lat):
              d = 0.001
              return (u.replace("{lon}", str(lon)).replace("{lat}", str(lat)).replace("{west}", str(lon - d)).replace("{south}", str(lat - d))
                       .replace("{east}", str(lon + d)).replace("{north}", str(lat + d))
                       .replace("{row}", str(math.floor((lat + 90) * 240))).replace("{col}", str(math.floor((lon + 180) * 240))))
          def read_value(ep, lon, lat):
              smp, use = (ep.get("details") or {}).get("sample") or {}, ep.get("use") or {}
              if smp.get("method") == "lerc-tile":
                  return "lerc tile (decode not run here): " + str(use.get("tile_url"))[-40:]
              if not use.get("sample_url"):
                  return f"no sample_url ({smp.get('method')})"
              try:
                  with urllib.request.urlopen(urllib.request.Request(fill(use["sample_url"], lon, lat), headers={"User-Agent": "atlas-mcp-check"}), timeout=60) as rr:
                      txt = rr.read().decode("utf-8", "replace")
              except Exception as e:
                  return f"{type(e).__name__}: {e}"[:80]
              if smp.get("method") == "identify":
                  return json.loads(txt).get("value")
              if smp.get("method") == "feature-info":
                  f = json.loads(txt).get("features") or [{}]
                  return f[0].get("properties", {}).get(smp.get("field"))
              if smp.get("method") == "opendap":
                  m = _re.search(r"\[0\], (-?\d+)", txt)
                  return m.group(1) if m else txt[:80]
              return txt[:80]
          for label, lon, lat in [("central North Sea", 1.9, 57.9), ("off the Niger Delta", 5.5, 4.0)]:
              for concept in ("bathymetry", "shipping"):
                  time.sleep(1.5)
                  r, status, s = call("find_datasets", {"lon": lon, "lat": lat, "radius_km": 2, "concept": concept, "capability": "sample", "limit": 12})
                  res = (r or {}).get("results", [])
                  print(f"find_datasets [{label}, {concept}, sample]: {status}, matches {(r or {}).get('matches')}: {[x['title'][:45] for x in res][:8]}")
                  for x in res[:6]:
                      g, status, s = call("get_dataset", {"id": x["id"]})
                      for ep in (g or {}).get("endpoints", []):
                          if "sample" in (ep.get("capabilities") or []):
                              print(f"  {x['id']} {x['title'][:40]!r}: {ep['protocol']} {((ep.get('details') or {}).get('sample') or {}).get('method')} -> {read_value(ep, lon, lat)}; attribution {'yes' if g.get('attribution') else 'no'}, open {g.get('open_licence')}")
                              break
          # Land elevation (Tobler request, 20 Nov): read a height through every sampled elevation endpoint near each point
          from atlas.sample_check import read_value as rv
          for label, lon, lat in [("London", -0.1271, 51.5079), ("Skye", -6.5785, 57.0567), ("Stornoway", -6.389, 58.21),
                                  ("Edinburgh", -3.19, 55.95), ("Paris", 2.3522, 48.8566), ("Tokyo", 139.7671, 35.6812),
                                  ("Bern", 7.4386, 46.9511), ("Madrid", -3.7038, 40.4168), ("Oslo", 10.7522, 59.9139),
                                  ("Cologne", 6.9603, 50.9375), ("Ottawa", -75.6972, 45.4215), ("Amsterdam", 4.8951, 52.3731),
                                  ("Sydney", 151.2093, -33.8688), ("Washington", -77.0365, 38.8977), ("Wellington", 174.7762, -41.2865)]:
              time.sleep(1.2)
              r, status, s = call("find_datasets", {"lon": lon, "lat": lat, "radius_km": 1, "concept": "elevation", "capability": "sample", "limit": 40})
              res = (r or {}).get("results", [])
              print(f"elevation [{label}]: {status}, matches {(r or {}).get('matches')}")
              for x in res[:10]:
                  g, status, s = call("get_dataset", {"id": x["id"]})
                  for ep in (g or {}).get("endpoints", []):
                      if "sample" in (ep.get("capabilities") or []):
                          smp = (ep.get("details") or {}).get("sample") or {}
                          print(f"  {x['id']} {x['title'][:48]!r} ({x.get('country') or '-'}): {smp.get('method')} -> {rv(ep, lon, lat)}; open {g.get('open_licence')}")
                          break
          if first_query:
              did, args = first_query
              r, status, s = call("get_dataset", {"id": did})
              print(f"get_dataset: {status}, {s:.1f}s, endpoints {len(r.get('endpoints', [])) if r else '-'}")
              fa = {"id": did, "limit": 50, **{k: v for k, v in args.items() if k in ("lon", "lat", "radius_km", "bbox")}}
              r, status, s = call("fetch_features", fa)
              print(f"fetch_features: {status}, {s:.1f}s, returned {r.get('returned') if r else '-'}")
          PY
      - name: Publish result (never the key)
        if: always()
        run: |
          mkdir -p /tmp/r && cp /tmp/check.txt /tmp/r/ 2>/dev/null || echo "check did not run" > /tmp/r/check.txt
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} $(date -u +%FT%TZ)" > /tmp/r/RUN.txt
          git config user.name atlas-bot; git config user.email atlas-bot@users.noreply.github.com
          git checkout -q --orphan tmp && git rm -rfq . && git clean -fdxq
          cp /tmp/r/* . && git add -A && git commit -qm "MCP check" && git push -qf origin HEAD:refs/heads/results/mcp-check
