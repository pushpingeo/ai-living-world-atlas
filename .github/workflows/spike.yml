name: spike
# A crawl "wave". Edit a file in runs/ (spike-<name>.env) and push to start one:
#   NAME=us  COUNTRIES=US  SEEDS=""  MINUTES=300  SHARDS=16
# CONCAT=1 merges shards by streaming them together (no cross-shard regrouping) for waves too big for memory.
# PREHARVEST=1 harvests the big catalogues (GeoNetwork, data.europa.eu) once, before the shards, and hands
# the records to every shard (HARVEST_MINUTES, default 300).
# Shards run in parallel; a final job merges them and publishes results/spike-<name>.
on:
  push:
    branches: [main]
    paths: ['runs/spike-*.env']
  workflow_dispatch:
    inputs:
      run_file:
        description: run file under runs/
        default: runs/spike-gb.env
permissions:
  contents: write
  actions: write  # to start the collections build after the Europe source wave
concurrency:
  group: spike-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.p.outputs.file }}
      name: ${{ steps.p.outputs.name }}
      shards: ${{ steps.p.outputs.shards }}
      preharvest: ${{ steps.p.outputs.preharvest }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: p
        run: |
          f="${{ github.event.inputs.run_file }}"
          if [ -z "$f" ]; then f=$(git diff --name-only HEAD~1 HEAD -- 'runs/spike-*.env' | head -1); fi
          [ -z "$f" ] && f=runs/spike-gb.env
          set -a; . "$f"; set +a
          NAME=${NAME:-$(basename "$f" .env | sed 's/^spike-//')}
          SHARDS=${SHARDS:-1}
          echo "file=$f" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          echo "preharvest=${PREHARVEST:-0}" >> $GITHUB_OUTPUT
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range($SHARDS))))")" >> $GITHUB_OUTPUT
  harvest:
    needs: plan
    if: needs.plan.outputs.preharvest == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Harvest catalogues once
        run: |
          set -a; . "${{ needs.plan.outputs.file }}"; set +a
          SEED_ARGS=""; for s in $SEEDS; do SEED_ARGS="$SEED_ARGS --seeds $s"; done
          touch /tmp/empty.parquet; mkdir -p cache
          set -o pipefail
          python -m atlas.spike --registry /tmp/empty.parquet --countries "" $SEED_ARGS --out cache \
            --minutes "${HARVEST_MINUTES:-300}" --harvest-only cache/portals.pkl 2>&1 | tee cache/harvest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-cache
          path: cache
          retention-days: 3
  crawl:
    needs: [plan, harvest]
    if: always() && needs.plan.result == 'success' && needs.harvest.result != 'failure' && needs.harvest.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch seed registry (Dateno, CC BY 4.0)
        run: curl -sSfL -o /tmp/registry.parquet https://raw.githubusercontent.com/commondataio/dataportals-registry/main/data/datasets/full.parquet
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.preharvest == '1'
        with:
          name: portal-cache
          path: cache
      - name: Crawl
        run: |
          set -a; . "${{ needs.plan.outputs.file }}"; set +a
          SEED_ARGS=""; for s in $SEEDS; do SEED_ARGS="$SEED_ARGS --seeds $s"; done
          set -o pipefail
          python -m atlas.spike --registry /tmp/registry.parquet --countries "${COUNTRIES:-}" $SEED_ARGS \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.shards }}" --out out --minutes "${MINUTES:-150}" \
            --portal-cache cache/portals.pkl 2>&1 | tee out-crawl.log
      - name: Keep shard output
        if: always()
        run: |
          mkdir -p out && cp out-crawl.log out/crawl.log 2>/dev/null || true
          cp cache/harvest.log out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: out
          retention-days: 7
  merge:
    needs: [plan, crawl]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge shards
        run: |
          ls shards
          set -a; . "${{ needs.plan.outputs.file }}"; set +a
          python -m atlas.merge --name "${{ needs.plan.outputs.name }}" --out out ${CONCAT:+--concat} shards/*
          for d in shards/*; do cp "$d/crawl.log" "out/crawl-$(basename $d).log" 2>/dev/null || true; done
          cp shards/shard-0/harvest.log out/ 2>/dev/null || true
          python -m atlas.parts split out   # GitHub rejects files over 100 MB
      - name: Publish results to branch
        if: always()
        run: |
          mkdir -p out
          echo "commit ${GITHUB_SHA} run ${GITHUB_RUN_ID} $(date -u +%FT%TZ) shards ${{ needs.plan.outputs.shards }}" > out/RUN.txt
          cp -r out /tmp/results
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git checkout -q --orphan tmp-results
          git rm -rfq . && git clean -fdxq
          cp -r /tmp/results/. .
          git add -A
          git commit -qm "Crawl results ${{ needs.plan.outputs.name }} (run ${GITHUB_RUN_ID})"
          git push -f origin HEAD:refs/heads/results/spike-${{ needs.plan.outputs.name }}
      - name: Start the derived wave (collections), if this wave feeds one
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -q "$GITHUB_SHA"
          set -a; . runs/collections.env; set +a
          if [ "${{ needs.plan.outputs.name }}" = "$SOURCE" ]; then
            gh workflow run collections.yml --ref main && echo "started collections for $TARGET"
          fi
