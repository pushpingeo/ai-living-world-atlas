name: publishers
# Publisher registry upkeep (atlas/publishers.py, docs/publisher-registry-design.md).
# candidates: weekly (Monday, after the night's sweep) or on a push of runs/publishers.env, opens GitHub issues of up
#   to 25 unregistered publishers each (ticking in a long issue is slow), unless any are still open. The candidates'
#   details go to results/publishers/candidates-<week>.json.
# apply: when Rob comments "add all", "add all except <codes>", "add <codes>" or "decline all" on one of those issues,
#   or closes it after ticking boxes, the added ones go into vocab/publishers.yaml and the rest of that issue's
#   candidates into vocab/publishers_declined.yaml. Only acts on issues the workflow opened, and only for Rob.
on:
  schedule:
    - cron: '41 10 * * 1'
  push:
    branches: [main]
    paths: ['runs/publishers.env']
  issues:
    types: [closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: publishers
  cancel-in-progress: false
jobs:
  candidates:
    if: github.event_name != 'issues' && github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if a candidate issue is still open
        id: open
        run: |
          n=$(gh issue list --label publisher-candidates --state open --json number -q 'length')
          echo "n=$n" >> $GITHUB_OUTPUT
          [ "$n" = "0" ] || echo "A candidate issue is still open: not opening another."
      - uses: actions/setup-python@v5
        if: steps.open.outputs.n == '0'
        with: { python-version: '3.12' }
      - name: Candidates
        if: steps.open.outputs.n == '0'
        run: |
          pip install -q -r requirements.txt
          bash .github/actions-fetch.sh
          top=20
          ticked=""
          if [ "${{ github.event_name }}" = "push" ]; then
            top=$(grep -E '^TOP=' runs/publishers.env | cut -d= -f2)
            ticked=$(grep -E '^TICKED=' runs/publishers.env | cut -d= -f2 || true)
          fi
          week=$(date -u +%F)
          echo "WEEK=$week" >> $GITHUB_ENV
          python -m atlas.publishers candidates --datasets /tmp/pub/datasets.parquet --top "$top" \
            --out /tmp/candidates.json --issue /tmp/issues --week "$week" --ticked "$ticked"
      - name: Save candidates and open the issue
        if: steps.open.outputs.n == '0'
        run: |
          git config user.name "atlas-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/res && cd /tmp/res
          if git -C $GITHUB_WORKSPACE ls-remote --exit-code origin results/publishers >/dev/null; then
            git clone -q --depth 1 --branch results/publishers "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" r
          else
            git init -q r && git -C r checkout -q --orphan results/publishers
            git -C r remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          fi
          cp /tmp/candidates.json "r/candidates-$WEEK.json"
          cd r && git add -A && git commit -qm "Publisher candidates, week of $WEEK" && git push -q origin HEAD:results/publishers
          gh label create publisher-candidates --repo ${{ github.repository }} --color 0e8a16 \
            --description "Weekly publisher registry candidates" 2>/dev/null || true
          for b in /tmp/issues/*.md; do
            gh issue create --repo ${{ github.repository }} --label publisher-candidates \
              --title "$(cat "${b%.md}.title")" --body-file "$b"
            sleep 2
          done
  apply:
    # closing (ticked boxes) or a command comment; GITHUB_TOKEN's own close after a command doesn't trigger a run
    if: >-
      github.event.sender.login == 'pushpingeo' &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      contains(github.event.issue.labels.*.name, 'publisher-candidates') &&
      (github.event_name == 'issues' ||
       (github.event_name == 'issue_comment' && github.event.issue.state == 'open' &&
        (startsWith(github.event.comment.body, 'add') || startsWith(github.event.comment.body, 'Add') ||
         startsWith(github.event.comment.body, 'decline') || startsWith(github.event.comment.body, 'Decline'))))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Apply ticked candidates
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          pip install -q pyyaml
          week=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          git fetch -q --depth 1 origin results/publishers
          git show "FETCH_HEAD:candidates-$week.json" > /tmp/candidates.json
          printf '%s' "$BODY" > /tmp/body.md
          out=$(python -m atlas.publishers apply --body /tmp/body.md --candidates /tmp/candidates.json \
                  --approver "rob (issue #$NUM)" --day "$(date -u +%F)" --command "$COMMAND")
          echo "$out"
          git config user.name "atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add vocab/publishers.yaml vocab/publishers_declined.yaml
          git commit -qm "Publisher registry: issue #$NUM ($out)" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh issue comment "$NUM" --body "Done: $out. The registry is in vocab/publishers.yaml."
          [ "${{ github.event_name }}" = "issue_comment" ] && gh issue close "$NUM" || true
