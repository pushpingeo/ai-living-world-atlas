name: probe
on:
  push:
    branches: [main]
    paths: ['runs/probe.urls']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch each URL (first 200KB) for inspection
        run: |
          mkdir -p /tmp/out; i=0
          grep -v '^#' runs/probe.urls | grep . | while read -r url; do
            i=$((i+1))
            # a line may start with "RANGE " to ask for the first 16 KB only (cloud-optimised files)
            rng=""; full=""; case "$url" in "RANGE "*) url="${url#RANGE }"; rng="-r 0-16383";; "FULL "*) url="${url#FULL }"; full=1;; esac
            # Origin: a browser page elsewhere; the CORS headers in the answer say whether a page could use it
            code=$(curl -sSL -m 60 $rng -H "Origin: https://asktobler.com" -D /tmp/hdr -A "ai-living-world-atlas probe (+https://github.com/pushpingeo/ai-living-world-atlas)" \
              -o /tmp/body -w '%{http_code} %{time_total}s %{size_download}B %{url_effective}' "$url" || echo "ERR")
            { echo "URL: $url"; echo "RESULT: $code"; echo "HEADERS: $(grep -iE '^(access-control-allow-origin|content-type|content-range|accept-ranges|content-length|last-modified|location):' /tmp/hdr | tr -d '\r' | tr '\n' ';')"; } > /tmp/out/$i.txt
            head -c 200000 /tmp/body >> /tmp/out/$i.txt 2>/dev/null || true
            # "FULL " keeps the whole answer (up to 20 MB) as $i.bin, for small downloads to inspect
            if [ -n "$full" ] && [ "$(stat -c%s /tmp/body)" -le 20000000 ]; then cp /tmp/body /tmp/out/$i.bin; fi
          done
          date -u > /tmp/out/when.txt
          git config user.name atlas-bot; git config user.email atlas-bot@users.noreply.github.com
          git checkout -q --orphan tmp && git rm -rfq . && git clean -fdxq
          cp /tmp/out/* . && git add . && git commit -qm probe && git push -qf origin HEAD:refs/heads/results/probe
