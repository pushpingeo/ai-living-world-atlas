# Datasets from a national publisher that genuinely cover far more than their own country, so the
# "extent mostly outside the publisher's country" check in atlas/api_data.py leaves them alone.
# Regular expressions matched against "title | publisher". Add one only after checking the layer's features.
genuinely_wider:
  - '^Minerals Resource Data System \| U\.S\. Geological Survey'   # USGS MRDS: mineral sites worldwide
  - '^DEM Global Mosaic: .* \| NOAA National Centers for Environmental Information'   # NCEI's worldwide DEM mosaic (vocab/seeds/values.yaml)
