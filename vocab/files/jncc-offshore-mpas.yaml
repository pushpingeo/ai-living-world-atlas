abstract: >-
  The boundaries of the UK's offshore Marine Protected Areas, beyond 12 nautical miles, as JNCC publishes them: Special
  Areas of Conservation and Special Protection Areas with marine components, Marine Conservation Zones, Highly Protected
  Marine Areas and Scottish Nature Conservation MPAs, including sites that straddle the 12-mile limit (their inshore
  parts are also in the country layers from Natural England, NatureScot, Natural Resources Wales and DAERA). Dogger
  Bank SAC is here. JNCC updates the file when the network changes; this copy is refreshed by hand.
