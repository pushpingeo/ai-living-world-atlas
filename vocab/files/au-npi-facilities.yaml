citation: National Pollutant Inventory, facilities, DCCEEW (data.gov.au)
columns: [facility_id, jurisdiction_code, jurisdiction_facility_id, facility_name, suburb, state, primary_anzsic_class_code, primary_anzsic_class_name, main_activities, first_report_year, latest_report_year, latest_report_url, reports]
tile_deg: 1
