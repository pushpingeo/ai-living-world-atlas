# Written 25 Nov 2026 for Australia pollution screening (gap review in the project,
# claude/pollution-sources-gap-review-2026-11-25.md). The NPI's WFS on data.gov.au publishes no feature types (probe
# rounds 46-47), so the atlas hosts the facilities GeoJSON as tiles. CC BY 4.0, read from data.gov.au's package record
# (probe round 45). Some facilities are family businesses or farms: the registered business name, ABN/ACN, street address,
# postcode and website are left out by the keep-list below.
