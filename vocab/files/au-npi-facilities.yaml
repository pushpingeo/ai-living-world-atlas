  terms: >-
    The business name, ABN, street address and website are left out because some facilities are family businesses or
    farms. A facility's emissions per substance are in the NPI's own reports (latest_report_url).
concepts_hint: [pollution-source, au-pollution-pack]
abstract: >-
  Facilities that report emissions to Australia's National Pollutant Inventory: industrial sites, mines, power stations,
  intensive farms, sewage works and others that use or emit any of 93 substances above set thresholds. One point per
  facility. primary_anzsic_class_name and main_activities give the industry; first_report_year and latest_report_year the
  years it reported (a facility whose latest year is old may have closed); latest_report_url opens its latest NPI report,
  with emissions by substance to air, land and water. Updated by 31 March each year.
