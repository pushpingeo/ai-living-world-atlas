abstract: >-
  The site boundaries of Nationally Significant Infrastructure Projects handled by the Planning Inspectorate under the
  Planning Act 2008: energy (generating stations, electric lines, gas), transport, water and waste projects, from
  pre-application to decision, with each project's reference (e.g. EN010151), stage, type, description and a link to its
  page. The boundaries are the ones used to inform environmental impact assessment and may change as a project
  develops. Covers projects in England (and some in Welsh waters); Scotland's Section 36 consents are not here.
