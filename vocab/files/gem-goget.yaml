id: gem-goget
title: Global Oil and Gas Extraction Tracker (extraction areas, development and discoveries)
publisher: Global Energy Monitor
publisher_type: civil-society
licence: "CC BY 4.0 (Global Energy Monitor tracker data, unless noted in the file)"
citation: "Global Oil and Gas Extraction Tracker, Global Energy Monitor, March 2026 release"
release: "March 2026"
landing_page: https://globalenergymonitor.org/projects/global-oil-gas-extraction-tracker/
abstract: >
  Global Energy Monitor's project-level tracker of oil and gas extraction: operating extraction areas, areas under
  development and discoveries in about 95 countries, with operator, owners, status, discovery and production-start
  years, and production and reserves where known. One feature per field: its outline where GEM has mapped one, otherwise a point. Fields with production of
  1 million boe/yr or more and/or reserves of 25 million boe.
