# Which endpoints return a number at a point: capability "sample" (Tobler request, 19 Nov 2026).
# Applied at publish time by atlas/sampling.py; the wave files keep what was crawled.
#
# Automatic:
#   - ArcGIS ImageServers with one band that aren't tiles-only and aren't RGB or display products: identify/getSamples.
#   - WCS coverages: GetCoverage of a tiny box.
# Curated records (vocab/seeds/values.yaml) say how to sample themselves in their endpoint info.
# Never: anything matching `never` in its title, layer name or address. Exaggerated relief returns exaggerated
# numbers (GEBCO 5x gave -435 m where the grid says -86 m), and hillshades and colour ramps return display values.

# WorldElevation3D (Esri's 3D elevation caches) answers identify with 0 everywhere, sea or land (checked 19 Nov 2026).
never: '(?i)worldelevation3d|exaggerat|\b\d+(\.\d+)?x\b|\d+pt\d+x|_\d+x(_|\b)|\d+x_|hillshade|hill shade|shaded relief|multidirectional|\bcolou?r(s|ed)?\b|rainbow|haxby|blue ?green|\brgb\b|_dra(_|\b)|\bdra\b|stretch'

# WMS layers whose GetFeatureInfo returns a number, checked by hand. `service` is the host, `layers` a regular
# expression on the layer name, `field` the property holding the value.
feature_info:
  # The sign differs between DTM releases: the current layer, 2020 and 2022 answer -87 in the central North Sea;
  # 2016 and 2018 answer 87 (checked 19 Nov 2026 through the MCP server's sample_url).
  - service: ows.emodnet-bathymetry.eu
    layers: '^emodnet:mean(_2020|_2022)?$'
    field: Depth
    value: elevation
    units: m
    vertical_datum: LAT (Lowest Astronomical Tide), per EMODnet
    note: Negative below the datum. Checked 19 Nov 2026 in the central North Sea (-86.3 m; DTM 2020 -87.0 m).
  - service: ows.emodnet-bathymetry.eu
    layers: '^emodnet:mean_(2016|2018)$'
    field: Depth
    value: depth
    units: m
    vertical_datum: LAT (Lowest Astronomical Tide), per EMODnet
    note: Positive below the datum in these older releases (87 m in the central North Sea, checked 19 Nov 2026).
  - service: ows.emodnet-humanactivities.eu
    layers: '^(emodnet:)?vesseldensity_\w+$'
    field: GRAY_INDEX
    value: density
    note: EMODnet vessel density (time spent by vessels per grid cell); see the layer description for units. Checked 19 Nov 2026 in the Dover Strait (4.56) and central North Sea (0.006).
  # Environment Agency lidar composites (England, OGL). The "Elevation" layers answer feature-info in metres;
  # the plain and Hillshade layers are display styles. Checked 20 Nov 2026: DTM 1m at Trafalgar Square, 9.55.
  - service: environment.data.gov.uk
    layers: '^Lidar_Composite_Elevation_(DTM|LZ_DSM|FZ_DSM)_(1m|2m)$'
    field: Elevation
    value: elevation
    units: m
    note: Bare-earth heights for DTM layers; DSM layers include buildings and trees. England only, where flown.
  # Scottish Remote Sensing Portal lidar (Scottish Government / JNCC, OGL). GeoServer answers feature-info with the
  # cell value as GRAY_INDEX. Checked 20 Nov 2026: Outer Hebrides 2019 DTM 50 cm at Stornoway, 3.14.
  - service: ows.remotesensing.data.gov.scot
    layers: '(?i)(dtm|dsm)'
    field: GRAY_INDEX
    value: elevation
    units: m
    note: DTM layers are bare earth; DSM layers include buildings and trees. Scotland only, where flown.
