# UK statutory protected sites as curated records (Tobler request, 22 Nov 2026: environmental consultants' must-check
# baseline). One record per designation and nation, pointing at the designating body's own feature service, checked to
# return features for a bounding box. Offshore sites (beyond 12 nautical miles) are JNCC's, hosted by the atlas as tiles
# (vocab/files/jncc-offshore-mpas.yaml). Written from each layer's live metadata on 22 Nov 2026 (counts, dates, extents);
# licences and attribution statements, verbatim, are in vocab/licence_overrides.yaml (rules for layers "^uk-...:").
# Endpoint info carries name_field and code_field (shown by get_dataset under details) and the data's own date.
# Why records rather than a crawl: the same layers are in the UK crawl under other titles, often without a licence, and
# Tobler needs fixed ids it can list. DAERA's server (gis.daera-ni.gov.uk) isn't reachable from the Claude workspace;
# its fields and counts were read through the probe workflow (rounds 22-24).
