  # --- land elevation: national and global sources that return a height at a point (20 Nov 2026) ------------
  # Template placeholders an agent fills: {lon} {lat} (WGS84); {west} {south} {east} {north} (WGS84 box);
  # {x} {y} and {xmin} {ymin} {xmax} {ymax} in sample.crs (box half-size sample.box_m). Values below were read live.
  - kind: wms
    url: https://ows.remotesensing.data.gov.scot/geoserver/ows
    publisher: Scottish Government and JNCC (Scottish Remote Sensing Portal)
    publisher_type: central-gov
    country: GB
    licence: Open Government Licence v3 (Scottish Remote Sensing Portal; each phase states its own attribution)
  - kind: record
    id: scotland-national-lidar-dtm-cog
    title: "Scottish National LiDAR Programme: 50 cm terrain model as cloud-optimised GeoTIFFs (1 km tiles)"
    publisher: Scottish Government (Scottish Remote Sensing Portal, hosted on AWS Open Data)
    publisher_type: central-gov
    country: GB
    abstract: >-
      Bare-earth digital terrain model at 50 cm from the Scottish National LiDAR Programme (captured 2025 to 2027), one
      cloud-optimised GeoTIFF per Ordnance Survey 1 km square, in British National Grid. A browser can read the cell at
      a point with a range request. Coverage grows as capture continues: a missing file means not flown yet. The older
      lidar phases are in the same bucket under their own names.
    endpoints:
      - protocol: cloud
        url: https://srsp-open-data.s3.eu-west-2.amazonaws.com/lidar/national-lidar-programme/dtm/27700/gridded/
        check_url: https://srsp-open-data.s3.eu-west-2.amazonaws.com/?list-type=2&max-keys=1&prefix=lidar/national-lidar-programme/dtm/27700/gridded/
        format: COG
        capabilities: [download, cloud, sample]
        info:
          bands: 1
          data_type: elevation
          sample:
            method: cog
            value: elevation
            units: m
            crs: EPSG:27700
            file_url: "{url}{osgb_1km}_50cm_DTM_ScotlandNationalLiDAR.tif"
            how: "osgb_1km is the Ordnance Survey 1 km grid reference of the point (two letters, then the km digits of easting and northing within the 100 km square, e.g. NG2205). Read the pixel at (x, y) in EPSG:27700. A 404 means the square isn't covered yet."
            note: "Browser-readable (CORS open). Checked 20 Nov 2026 by mcp-check."
    landing_page: https://remotesensingdata.gov.scot/
    licence: Open Government Licence v3
    bbox: [-8.8, 54.6, -0.7, 60.9]
    detail_m: 0.5
    geometry_type: raster
    concepts_hint: [elevation, lidar, digital terrain model]
  - kind: record
    id: copernicus-dem-glo30-cog-sample
    title: "Copernicus DEM GLO-30: 30 m global surface heights as cloud-optimised GeoTIFFs (AWS Open Data)"
    publisher: European Space Agency / Copernicus (AWS Open Data copy)
    abstract: >-
      Copernicus GLO-30, one cloud-optimised GeoTIFF per 1-degree square, worldwide. It is a surface model: heights
      include buildings and trees, so it reads high in towns and forests; national lidar terrain models are bare earth.
      Range reads work, but the bucket sends no CORS headers, so a web page can't read it directly: fetch through a
      server (Tobler's Worker). A missing file means sea, or a square not released at 30 m (Armenia, Azerbaijan).
    endpoints:
      - protocol: cloud
        url: https://copernicus-dem-30m.s3.amazonaws.com/
        check_url: https://copernicus-dem-30m.s3.amazonaws.com/?list-type=2&max-keys=1
        format: COG
        capabilities: [download, cloud, sample]
        info:
          bands: 1
          data_type: elevation
          sample:
            method: cog
            value: elevation
            units: m
            crs: EPSG:4326
            browser: false
            file_url: "{url}Copernicus_DSM_COG_10_{NS}{LAT}_00_{EW}{LON}_00_DEM/Copernicus_DSM_COG_10_{NS}{LAT}_00_{EW}{LON}_00_DEM.tif"
            how: "LAT = abs(floor(lat)) as 2 digits, NS = N if floor(lat) >= 0 else S; LON = abs(floor(lon)) as 3 digits, EW = E if floor(lon) >= 0 else W. Read the pixel at (lon, lat)."
            vertical_datum: EGM2008 geoid
            note: "Surface model (DSM), not bare earth. Checked 20 Nov 2026 by mcp-check."
    landing_page: https://registry.opendata.aws/copernicus-dem/
    licence: Copernicus DEM GLO-30 licence (free of charge for any use, attribution required)
    bbox: [-180, -90, 180, 90]
    detail_m: 30
    geometry_type: raster
    concepts_hint: [elevation, digital surface model]
