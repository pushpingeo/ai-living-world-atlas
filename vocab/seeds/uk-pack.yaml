# The broadened UK screening pack (Tobler request, 23 Nov 2026): landscape, heritage, peat, farmland quality, flood zones
# and the SSSI Impact Risk Zones, per nation, each on the designating or publishing body's own service. Complements
# vocab/seeds/uk-protected.yaml (nature sites, 22 Nov). Written by a one-off script from live metadata on 23 Nov 2026
# (counts, dates, extents, fields); hosts the workspace can't reach (HES, SEPA, Scottish Government, DataMapWales,
# DAERA, Hutton, Defra) were read through the probe workflow (rounds 26-30). Licences and attribution statements,
# verbatim, are in vocab/licence_overrides.yaml (rules for "^uk-...:" and for the WFS feature types).
# WFS endpoints name their feature type in info.type_name, which the MCP server and the viewer send as typeName.
# Not licence-open, on purpose: uk-ns-carbon-peatland-2016 (UK Non-Commercial Government Licence) and uk-hutton-lca-250k
# (James Hutton Institute Open Data Licence, terms not read).
