      flag_field: SFHA_TF
      class_values:
      - A
      - AE
      - AH
      - AO
      - AR
      - A99
      - V
      - VE
      - X
      - D
      - OPEN WATER
      - AREA NOT INCLUDED
      nation: United States
      completeness: partial
      completeness_note: communities with digital flood maps (NFHL); layer 0 of the service, NFHL Availability, shows where
        the NFHL has data. Elsewhere older paper maps may apply
    check_url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28/query?geometry=-95.4,29.7,-95.3,29.8&geometryType=esriGeometryEnvelope&inSR=4326&outFields=FLD_ZONE&returnGeometry=false&resultRecordCount=1&f=json
