  abstract: 'California''s Drinking Water Source Assessment and Protection (DWSAP) programme, which is also the state''s
    wellhead protection programme, delineates protection zones round public supply wells and intakes as part of each
    source assessment. No statewide layer of those zones is published: the State Water Board''s public GIS server
    (gispublic.waterboards.ca.gov, read 26 Nov 2026) has public water system boundaries and, since 2015, the reported
    locations of public water system wells (GAMA), but no protection zones. This record has no data endpoint on purpose. A
    check that needs these zones in California should say they are not available from open data, and never that there are
    none. A curated record for US site screening (Tobler, 26 Nov 2026).'
