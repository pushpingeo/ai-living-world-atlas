# Global backbones: a short, hand-picked list of international sources.
# Each entry is crawled like any other service. Download-only sources (files, cloud buckets, APIs)
# are listed as records with their own metadata, because there is no service to read it from.
#
# kind: arcgis-root | arcgis-service | wms | wfs | wmts | wcs | arcgis-online-search | record
# licence: only what the publisher states, with where we read it; blank means "read it from the service".

defaults:
  publisher_type: international
  country: ""        # global

sources:
  # --- protected and sensitive areas ---------------------------------------------------------
  - kind: arcgis-root
    url: https://data-gis.unep-wcmc.org/server/rest/services
    publisher: UNEP-WCMC
    note: WDPA, WD-OECM and other UNEP-WCMC layers. WDPA terms restrict commercial use.
  - kind: wms
    url: https://geo.vliz.be/geoserver/MarineRegions/wms
    publisher: Flanders Marine Institute (VLIZ) - Marine Regions
  - kind: wfs
    url: https://geo.vliz.be/geoserver/MarineRegions/wfs
    publisher: Flanders Marine Institute (VLIZ) - Marine Regions
  - kind: record
    id: unesco-world-heritage-list
    title: UNESCO World Heritage List (sites with coordinates)
    publisher: UNESCO World Heritage Centre
    abstract: The official list of World Heritage properties, with location, category, state party and date of inscription, published by the World Heritage Centre as XML.
    endpoints:
      - {protocol: download, url: "https://whc.unesco.org/en/list/xml/", format: XML}
    landing_page: https://whc.unesco.org/en/list/
    bbox: [-180, -90, 180, 90]
    concepts_hint: [heritage-site]
  - kind: record
    id: landmark-indigenous-community-lands
    title: LandMark - Indigenous and Community Lands
    publisher: LandMark (Global Platform of Indigenous and Community Lands)
    abstract: Global maps of lands held or used by Indigenous Peoples and local communities, compiled from national and community sources. Absence of mapped land does not mean absence of customary tenure.
    endpoints:
      - {protocol: landing, url: "https://www.landmarkmap.org/data"}
    landing_page: https://www.landmarkmap.org/
    licence: CC BY 4.0 (per LandMark data page)
    bbox: [-180, -60, 180, 84]
    concepts_hint: [indigenous-land]

  # --- energy and industry -------------------------------------------------------------------
  - kind: record
    id: gem-global-energy-trackers
    title: Global Energy Monitor trackers (plants, pipelines, oil and gas extraction, LNG)
    publisher: Global Energy Monitor
    abstract: Project-level global trackers of energy infrastructure - coal, gas and oil plants, pipelines, LNG terminals, oil and gas extraction sites - with owners, status and capacity. Downloads are by request form.
    endpoints:
      - {protocol: landing, url: "https://globalenergymonitor.org/projects/"}
    landing_page: https://globalenergymonitor.org/
    licence: CC BY 4.0 unless noted (per GEM)
    bbox: [-180, -60, 180, 84]
    concepts_hint: [power-plant, pipeline, oil-gas]

  # --- terrain, water, oceans ----------------------------------------------------------------
  - kind: wms
    url: https://wms.gebco.net/mapserv
    publisher: GEBCO (IHO-IOC)
  - kind: record
    id: copernicus-dem-glo30
    title: Copernicus DEM GLO-30 (30 m global digital surface model)
    publisher: European Space Agency / Copernicus
    abstract: Global 30 m digital surface model as Cloud Optimized GeoTIFF tiles, mirrored on the AWS Registry of Open Data.
    endpoints:
      - {protocol: cloud, url: "https://copernicus-dem-30m.s3.amazonaws.com/", format: COG}
    landing_page: https://registry.opendata.aws/copernicus-dem/
    bbox: [-180, -90, 180, 90]
    detail_m: 30
    concepts_hint: [elevation]
  - kind: record
    id: hydrosheds-hydrorivers
    title: HydroRIVERS (global river network)
    publisher: WWF / HydroSHEDS
    abstract: 8.5 million river reaches derived from HydroSHEDS at 15 arc-seconds, with length, river order and an estimate of long-term discharge.
    endpoints:
      - {protocol: landing, url: "https://www.hydrosheds.org/products/hydrorivers"}
    landing_page: https://www.hydrosheds.org/products/hydrorivers
    licence: Free for scientific, educational and commercial use under the HydroSHEDS licence (per hydrosheds.org)
    bbox: [-180, -56, 180, 84]
    detail_m: 450
    concepts_hint: [river, watershed]
  - kind: record
    id: hydrosheds-v2-core
    title: HydroSHEDS v2 core data (flow direction, accumulation, basins)
    publisher: WWF / HydroSHEDS
    abstract: Second-generation HydroSHEDS rasters and vectors in 10x10 degree tiles and continental composites. The Americas are also in ArcGIS Living Atlas as feature layers.
    endpoints:
      - {protocol: landing, url: "https://www.hydrosheds.org/downloads-core-data-v2"}
    landing_page: https://www.hydrosheds.org/
    bbox: [-180, -56, 180, 84]
    concepts_hint: [river, watershed]

  # --- land cover, settlements, population ---------------------------------------------------
  - kind: wms
    url: https://services.terrascope.be/wms/v2
    publisher: VITO / ESA (Terrascope) - ESA WorldCover and Sentinel products
    licence: ESA WorldCover is CC BY 4.0 (per the openEO collection record)
  - kind: wmts
    url: https://services.terrascope.be/wmts/v2
    publisher: VITO / ESA (Terrascope) - ESA WorldCover and Sentinel products
  - kind: wms
    url: https://geospatial.jrc.ec.europa.eu/geoserver/wms
    publisher: European Commission Joint Research Centre (JRC)
    note: Includes GHSL built-up and population layers.
  - kind: record
    id: ghsl-cloud
    title: Global Human Settlement Layer (GHS-BUILT-S, GHS-POP and related) - cloud copies
    publisher: European Commission Joint Research Centre (JRC)
    abstract: Built-up surface, built-up volume, population and settlement model grids 1975-2030 at 10 m to 1 km, as Cloud Optimized GeoTIFFs on the AWS Registry of Open Data.
    endpoints:
      - {protocol: cloud, url: "https://jrc-ghsl.s3.eu-central-1.amazonaws.com/", format: COG}
    landing_page: https://registry.opendata.aws/ghs-built-s/
    licence: CC BY 4.0 (per the AWS registry entry)
    bbox: [-180, -90, 180, 90]
    concepts_hint: [settlement, population, building]
  - kind: record
    id: overture-maps
    title: Overture Maps (places, buildings, transportation, divisions, base)
    publisher: Overture Maps Foundation
    abstract: Global open map data released monthly as GeoParquet in cloud storage, combining OpenStreetMap and other open sources.
    endpoints:
      - {protocol: cloud, url: "https://overturemaps-us-west-2.s3.amazonaws.com/release/", format: GeoParquet}
    landing_page: https://docs.overturemaps.org/
    bbox: [-180, -90, 180, 90]
    concepts_hint: [building, road, place-name, admin-boundary]

  # --- boundaries ----------------------------------------------------------------------------
  - kind: record
    id: geoboundaries
    title: geoBoundaries (administrative boundaries, all countries, ADM0-ADM5)
    publisher: William & Mary geoLab
    abstract: Open administrative boundaries for every country, with an API listing download links per country and level.
    endpoints:
      - {protocol: api, url: "https://www.geoboundaries.org/api/current/gbOpen/ALL/ALL/", format: JSON}
    landing_page: https://www.geoboundaries.org/
    bbox: [-180, -90, 180, 90]
    concepts_hint: [admin-boundary]
  - kind: record
    id: natural-earth-admin0
    title: Natural Earth 1:10m admin 0 countries
    publisher: Natural Earth
    abstract: Country boundaries at 1:10 million scale, public domain.
    endpoints:
      - {protocol: download, url: "https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_0_countries.zip", format: Shapefile}
    landing_page: https://www.naturalearthdata.com/
    licence: Public domain (per Natural Earth)
    bbox: [-180, -90, 180, 90]
    detail_m: 5000
    concepts_hint: [admin-boundary]

  # --- soils, agriculture, food ---------------------------------------------------------------
  - kind: wms
    url: https://maps.isric.org/mapserv?map=/map/soc.map
    publisher: ISRIC - World Soil Information (SoilGrids)
  - kind: wms
    url: https://maps.isric.org/mapserv?map=/map/phh2o.map
    publisher: ISRIC - World Soil Information (SoilGrids)
  - kind: wms
    url: https://maps.isric.org/mapserv?map=/map/clay.map
    publisher: ISRIC - World Soil Information (SoilGrids)
  - kind: wms
    url: https://io.apps.fao.org/geoserver/ows
    publisher: Food and Agriculture Organization of the United Nations (FAO)
  - kind: wms
    url: https://www.fao.org/fishery/geoserver/wms
    publisher: FAO Fisheries and Aquaculture Division

  # --- forests, hazards, earth observation ----------------------------------------------------
  - kind: arcgis-root
    url: https://gis-gfw.wri.org/arcgis/rest/services
    publisher: World Resources Institute (Global Forest Watch)
  - kind: wmts
    url: https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/wmts.cgi
    publisher: NASA GIBS (Global Imagery Browse Services)
  - kind: record
    id: usgs-earthquakes-month
    title: USGS earthquakes, past 30 days (all magnitudes)
    publisher: U.S. Geological Survey
    abstract: Real-time GeoJSON feed of earthquakes worldwide, updated every minute.
    endpoints:
      - {protocol: api, url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson", format: GeoJSON}
    landing_page: https://earthquake.usgs.gov/earthquakes/feed/
    licence: Public domain (U.S. Government work)
    bbox: [-180, -90, 180, 90]
    concepts_hint: [earthquake, natural-hazard]

  # --- Europe-wide environment (EEA / Copernicus Land) ----------------------------------------
  - {kind: arcgis-root, url: "https://image.discomap.eea.europa.eu/arcgis/rest/services", publisher: European Environment Agency}
  - {kind: arcgis-root, url: "https://bio.discomap.eea.europa.eu/arcgis/rest/services", publisher: European Environment Agency}
  - {kind: arcgis-root, url: "https://water.discomap.eea.europa.eu/arcgis/rest/services", publisher: European Environment Agency}
  - {kind: arcgis-root, url: "https://climate.discomap.eea.europa.eu/arcgis/rest/services", publisher: European Environment Agency}

  # --- OpenStreetMap -------------------------------------------------------------------------
  - kind: record
    id: osm-overpass
    title: OpenStreetMap via the Overpass API
    publisher: OpenStreetMap contributors (Overpass API)
    abstract: Query any OpenStreetMap feature by tag within an area - power lines, protected areas, places of worship, roads. Keep queries site-sized; it is a shared public service.
    endpoints:
      - {protocol: api, url: "https://overpass-api.de/api/interpreter", format: Overpass QL / JSON}
    landing_page: https://wiki.openstreetmap.org/wiki/Overpass_API
    licence: ODbL 1.0 (OpenStreetMap)
    bbox: [-180, -90, 180, 90]
    concepts_hint: [power-line, power-plant, pipeline, settlement, road, protected-area]

  # --- ArcGIS Living Atlas: public, no-subscription items ---------------------------------------
  - kind: arcgis-online-search
    query: "group:47dd57c9a59d458c86d3d6b978560088"
    publisher: Esri ArcGIS Living Atlas (as listed)
    note: Items needing a subscription or credits are skipped. The publisher is taken from each item's credits.
