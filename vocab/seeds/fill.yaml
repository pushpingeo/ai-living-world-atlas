    title: World Bank official boundaries (admin 0 and admin 1)
    publisher: World Bank Group
    publisher_type: international
    abstract: The World Bank's official country and first-level administrative boundaries, as used in its own maps, with disputed areas and lines marked. Download from the World Bank Data Catalog.
