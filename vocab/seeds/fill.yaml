  - {kind: wms, url: "https://maps.isric.org/mapserv?map=/map/nitrogen.map", publisher: ISRIC - World Soil Information (SoilGrids), publisher_type: research}
  - {kind: wms, url: "https://maps.isric.org/mapserv?map=/map/ocd.map", publisher: ISRIC - World Soil Information (SoilGrids), publisher_type: research}
  - {kind: wms, url: "https://maps.isric.org/mapserv?map=/map/ocs.map", publisher: ISRIC - World Soil Information (SoilGrids), publisher_type: research}
  - {kind: wms, url: "https://maps.isric.org/mapserv?map=/map/sand.map", publisher: ISRIC - World Soil Information (SoilGrids), publisher_type: research}
