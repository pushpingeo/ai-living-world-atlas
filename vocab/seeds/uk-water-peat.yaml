  id: uk-ea-storm-overflow-annual-returns-2025
  title: Storm overflow spills in 2025, England and Wales (EA annual returns, mapped by The Rivers Trust)
  publisher: The Rivers Trust
  publisher_type: civil-society
  country: GB
  abstract: 'Every storm overflow in England and Wales with an event duration monitor, from the water companies'' 2025 annual
    returns to the Environment Agency and Natural Resources Wales: countedSpills (spills in the year, counted the EA''s way),
    totalDurationAllSpillsHrs, edmOperationPercent (how much of the year the monitor worked), the receiving water (recievingWaterName,
    spelt so), whether it affects a bathing or shellfish water, and any improvement or investigation activity. The Rivers
    Trust mapped the outlets and flags locations it corrected (riversTrustErrorFlag). All eleven companies, including Southern
    Water and Dŵr Cymru Welsh Water. Fields: name field siteNameEA, code field permitReferenceEA, class field waterCompanyName,
    count field countedSpills. 16,501 features. Completeness: complete (every monitored storm overflow in England and Wales
    in the 2025 returns; one year, so a site built or monitored since isn''t in it). The EA''s own annual return files are
    downloads on data.gov.uk (OGL); this is the mapped copy. Earlier years (2020-2024) are separate layers from the same publisher.
    A curated record for UK screening (Tobler, 24 Nov 2026): the publisher''s own layer, checked to return features for a
    bounding box.'
