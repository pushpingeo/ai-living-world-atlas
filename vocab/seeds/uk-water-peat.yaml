- kind: record
  id: uk-anglian-water-storm-overflows-live
  title: 'Storm overflows, live status: Anglian Water'
  publisher: Anglian Water
  publisher_type: business
  country: GB
  abstract: 'Anglian Water''s storm overflows (combined sewer overflows) with their status, updated in near real time from
    the monitors on each outlet, in the format all English water companies publish through the National Storm Overflow Hub.
    Status is 1 when the overflow is discharging now, 0 when not, -1 when the monitor is offline; LatestEventStart and LatestEventEnd
    give the latest discharge; ReceivingWaterCourse is the river or sea it discharges to. Live status, not a history: for
    spill counts over a year use the annual returns record. Fields: code field Id, status field Status, date field LatestEventEnd,
    water field ReceivingWaterCourse. 1,439 features. Completeness: partial (only Anglian Water''s overflows; each English
    water company publishes its own layer (Southern Water''s isn''t on ArcGIS Online), so an empty answer here says nothing
    about another company''s area). A curated record for UK screening (Tobler, 24 Nov 2026): the publisher''s own layer, checked
    to return features for a bounding box.'
  licence: Creative Commons Attribution 4.0 (CC BY 4.0), stated on Anglian Water's ArcGIS Online item.
