# Wales, Scottish Water) and the England Peat Map (peaty soil extent, depth observations, restoration register).
# Rob, 24 Nov 2026: curate these as normal records (claude/hosting-uk-downloads-scope.md in the project: they're live
# services, so no hosting). Same shape as the other UK packs: nation, completeness, completeness_note on every endpoint.
# Written by a one-off script from live metadata. Not open: Scottish Water's (all rights reserved, third-party copy).
# Not found: Southern Water's and Welsh Water's live layers (both are in the annual returns).
defaults:
  publisher_type: public-body
  country: GB
