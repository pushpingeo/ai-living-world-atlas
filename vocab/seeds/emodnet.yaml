# EMODnet (European Marine Observation and Data Network): each thematic portal's WFS and WMS, plus EMODnet's
# GeoNetwork catalogue for descriptions and licences. Asked for by Tobler (17 Nov 2026): the atlas had EMODnet Human
# Activities as WMS only, with no licence, from data.europa.eu. A layer published by both WFS and WMS on one server is
# grouped into one dataset ("ogc-name"), so fetch_features can use the WFS. Catalogue records are joined to layers by
# server and layer name (e.g. emodnet:heritageshipwrecks). All endpoints answered a probe on 17 Nov (probe round 6).
#
# kind: arcgis-root | arcgis-service | wms | wfs | wmts | wcs | arcgis-online-search | geonetwork | record
# licence: only what the publisher states; blank means "read it from the service or its catalogue record".

defaults:
  publisher_type: international
  country: ""

sources:
