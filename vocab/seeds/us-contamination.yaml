# US contamination screening (24 Nov 2026; Tobler's reply in the project, claude/contamination-tobler-reply.md): EPA's
# national layers, curated with fixed ids, in the same shape as the UK packs: every endpoint's info carries nation
# ("United States"), completeness (complete | partial) and completeness_note. Legacy sources (Superfund, brownfields, RCRA
# corrective action) and current pollution sources (TRI, ICIS-Air, NPDES, RCRA TSD). All public domain (US federal works).
# Written by a one-off script from live metadata. Not curated: EPA's 900k RCRA hazardous waste handlers (too broad for a
# screen), Cleanups in My Community (overlaps these), state cleanup lists (search concept contaminated-land: partial).
defaults:
  publisher_type: central-gov
  country: US
