    field INTEREST_TYPE. 32,019 features. Completeness: complete (every site in EPA''s Superfund system; state-run cleanup
    sites aren''t in it). Points come from EPA''s Facility Registry Service (FRS): one point per facility and programme, located
    from reported coordinates or the address; ACCURACY_VALUE and COLLECT_MTH_DESC say how good the location is. FAC_URL links
